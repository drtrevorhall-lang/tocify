project:
  type: website
  output-dir: _site
  # Render ONLY these. Without an explicit list, Quarto treats every .qmd AND .md in
  # the project as a page, so interests.qmd and interests.md would both try to write
  # interests.html (an output collision that fails the render), and README.md would
  # become a stray page. digest.md and interests.md are content, pulled in via
  # {{< include >}}; includes still resolve fine when a file is not in this list.
  render:
    - index.qmd
    - interests.qmd

website:
  title: "Pediatric Neuropsychology Digest"
  description: "Weekly journal scan. Pediatric neurotrauma, neurocritical care outcomes, and neuropsychological assessment"
  navbar:
    left:
      - href: index.qmd
        text: Digest
      - href: interests.qmd
        text: Interests
    right:
      - icon: github
        href: https://github.com/SamSievertsen/tocify
  page-footer:
    center: "Auto-generated weekly. Scores are model judgements, not peer review."

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    anchor-sections: true
    smooth-scroll: true
