name: Publish site to GitHub Pages

# NOTE: a push made by the digest job using the default GITHUB_TOKEN does NOT
# re-trigger `on: push`. That is why `workflow_run` is here. It is what actually
# publishes the weekly digest. The `push` trigger only covers your own manual edits.

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".github/workflows/validate-feeds.yml"
  workflow_run:
    workflows: ["Weekly ToC Digest"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # For workflow_run, check out the commit the digest job just pushed.
        uses: actions/checkout@v5        
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Turns Pages on via the API if it is not already on, and creates the
      # github-pages environment. Without this, deploy-pages fails with a bare
      # 404 whenever Pages has not been enabled by hand in Settings -> Pages.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
